<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>streambotkh.com - Livestream Donation Alerts & ABA Bakong KHQR</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/images/logo-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Orbitron:wght@500;700;900&family=Press+Start+2P&family=Bebas+Neue&family=Kanit:wght@400;600;700&family=Montserrat:wght@400;600;800;900&family=Permanent+Marker&family=VT323&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/fonts/khmer-fonts.css" />
    <script>
      // Overlay / widget source URLs must be 100% transparent from the very first paint
      (function () {
        var p = window.location.pathname.toLowerCase();
        if (p.indexOf('/overlay') === 0 || p.indexOf('/widget') === 0) {
          document.documentElement.className += ' obs-transparent';
          var s = document.createElement('style');
          s.innerHTML = 'html,body,#root,main{background:transparent !important;background-color:transparent !important;background-image:none !important;}';
          document.head.appendChild(s);
        }
      })();
    </script>
  </head>
  <body class="bg-[#070A12] text-slate-100 antialiased font-['Inter',sans-serif] selection:bg-cyan-500 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
